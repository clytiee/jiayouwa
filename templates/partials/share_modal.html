<style>
[x-cloak] { display: none !important; }
</style>

<div x-data="shareModal()" 
     x-show="open" 
     x-cloak
     x-transition.duration.200
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
     @click.away="close()">
    
    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden">
        
        <!-- 头部 -->
        <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
            <h3 class="text-lg font-bold text-gray-800">📤 分享资源</h3>
            <button @click="close()" class="text-gray-400 hover:text-gray-600 text-xl">×</button>
        </div>
        
        <!-- 内容 -->
        <div class="p-6">
            
            <!-- 资源信息 -->
            <div class="flex items-center space-x-3 mb-4">
                <div class="w-16 h-16 rounded-xl bg-gray-100 overflow-hidden flex-shrink-0">
                    <img x-show="coverImage" :src="coverImage" alt="" class="w-full h-full object-cover">
                    <div x-show="!coverImage" class="w-full h-full flex items-center justify-center text-3xl">📄</div>
                </div>
                <div class="min-w-0">
                    <div class="font-medium text-gray-800 text-sm truncate" x-text="title"></div>
                    <div class="text-xs text-gray-400">分享给朋友，一起学习 🐸</div>
                </div>
            </div>
            
            <!-- 分享链接 -->
            <div class="mb-4">
                <label class="text-sm font-medium text-gray-700">🔗 分享链接</label>
                <div class="flex items-center space-x-2 mt-1">
                    <input type="text" :value="shareUrl" readonly 
                           class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 font-mono">
                    <button @click="copyLink()" 
                            class="px-4 py-2 bg-green-500 text-white rounded-lg text-sm hover:bg-green-600 transition whitespace-nowrap">
                        📋 复制
                    </button>
                </div>
                <p x-show="copied" x-transition class="text-xs text-green-600 mt-1">✅ 已复制到剪贴板！</p>
            </div>
            
            <!-- 分享渠道 -->
            <div class="mb-4">
                <label class="text-sm font-medium text-gray-700">📝 文案预览</label>
                <button @click="shareTo('other')" 
                        class="ml-2 px-4 py-2 bg-gray-100 text-gray-700 rounded-full text-sm hover:bg-gray-200 transition">
                    📋 复制文案
                </button>
                <div class="mt-3 p-3 bg-gray-50 rounded-lg border border-gray-200">
                    <p class="text-sm text-gray-700 break-all" x-text="shareText"></p>
                </div>
            </div>
            
            <!-- 奖励说明 -->
            <div class="bg-green-50 rounded-xl p-3 text-xs text-green-700">
                💡 分享奖励：<br>
                • 朋友注册 → 你 <strong>+5 油滴</strong><br>
                • 朋友下载资源 → 你 <strong>+1 油滴</strong>
            </div>
        </div>
    </div>
</div>

<script>
function shareModal() {
    return {
        open: false,
        resourceId: null,
        title: '',
        coverImage: '',
        shareUrl: '',
        shareId: '',
        shareText: '',
        copied: false,
        imageGenerated: false,
        
        init() {
            document.addEventListener('open-share-modal', (event) => {
                this.resourceId = event.detail.resourceId;
                this.title = event.detail.title;
                this.coverImage = event.detail.coverImage || '';
                this.open = true;
                this.createShare();
            });
        },
        
        async createShare() {
            try {
                const resp = await fetch('/s/create/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        resource_id: this.resourceId
                    })
                });
                const data = await resp.json();
                if (data.success) {
                    this.shareUrl = data.share_url;
                    this.shareId = data.share_id;
                    this.shareText = `🐸 我在加油哇发现了一个好资源：${this.title}\n学习路上，一起加油哇！\n${this.shareUrl}`;
                } else {
                    alert('生成分享链接失败：' + data.error);
                }
            } catch(e) {
                alert('网络错误，请重试');
            }
        },
        
        shareTo(channel) {
            if (channel === 'other') {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(this.shareText).then(() => {
                        this.showToast('✅ 文案已复制，快去分享吧！ 🎉');
                    }).catch(() => {
                        this.fallbackCopy(this.shareText);
                    });
                } else {
                    this.fallbackCopy(this.shareText);
                }
                return;
            }
            alert(`📱 分享到 ${channel}：\n\n${this.shareText}`);
        },
        
        fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            textarea.setSelectionRange(0, text.length);
            
            try {
                const success = document.execCommand('copy');
                if (success) {
                    this.showToast('✅ 文案已复制，快去分享吧！ 🎉');
                } else {
                    this.showToast('❌ 复制失败，请手动复制');
                }
            } catch (e) {
                this.showToast('❌ 复制失败，请手动复制');
            }
            document.body.removeChild(textarea);
        },
        
        showToast(message) {
            const oldToast = document.querySelector('.share-toast');
            if (oldToast) oldToast.remove();
            
            const toast = document.createElement('div');
            toast.className = 'share-toast';
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                background: #1a1a2e;
                color: white;
                padding: 12px 24px;
                border-radius: 12px;
                font-size: 14px;
                z-index: 9999;
                box-shadow: 0 8px 30px rgba(0,0,0,0.3);
                max-width: 90%;
                text-align: center;
                animation: fadeInUp 0.3s ease;
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 500);
            }, 3000);
        },
        
        close() {
            this.open = false;
            this.imageGenerated = false;
            this.copied = false;
        },
        
        async copyLink() {
            try {
                await navigator.clipboard.writeText(this.shareUrl);
                this.copied = true;
                setTimeout(() => { this.copied = false; }, 2000);
            } catch(e) {
                const input = document.querySelector('input[type="text"]');
                if (input) {
                    input.select();
                    document.execCommand('copy');
                    this.copied = true;
                    setTimeout(() => { this.copied = false; }, 2000);
                }
            }
        },
        
        generateImage() {
            this.imageGenerated = true;
        },
        
        downloadImage() {
            alert('💾 图片下载功能开发中...');
        }
    }
}
</script>
