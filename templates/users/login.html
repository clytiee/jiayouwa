{% extends 'base.html' %}
{% load static %}

{% block title %}登录 - 加油哇 🐸{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-200px)] flex items-center justify-center py-12">
    <div class="w-full max-w-md">
        
        <!-- 顶部青蛙 + 标题 -->
        <div class="text-center mb-8">
            <div class="avatar-frog avatar-frog-lg mx-auto mb-3 shadow-lg">🐸</div>
            <h1 class="text-2xl font-bold text-gray-800">欢迎回来！</h1>
            <p class="text-gray-400 text-sm mt-1">学习路上，一起加油哇！</p>
        </div>

        <!-- 登录卡片 -->
        <div class="bg-white rounded-2xl card-shadow p-6 sm:p-8">
            <form method="POST" novalidate>
                {% csrf_token %}
                
                {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
                {% endif %}

                <!-- 用户名/邮箱 -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">👤 用户名 / 邮箱</label>
                    <input type="text" name="username" value="{{ form.username.value|default:'' }}"
                           placeholder="输入用户名或邮箱地址"
                           class="input-field {% if form.errors %}error{% endif %}"
                           autofocus required>
                    <p class="text-gray-400 text-xs mt-1">支持用户名或邮箱登录</p>
                </div>

                <!-- 密码 -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">🔒 密码</label>
                    <input type="password" name="password" placeholder="请输入密码"
                           class="input-field {% if form.errors %}error{% endif %}"
                           required>
                </div>

                <!-- 错误信息 -->
                {% if form.errors %}
                <div class="message-error text-sm mb-4">
                    <p>用户名或密码错误，请重新输入</p>
                </div>
                {% endif %}

                <!-- 记住我 -->
                <div class="flex items-center justify-between mb-6">
                    <label class="flex items-center space-x-2 text-sm text-gray-600 cursor-pointer">
                        <input type="checkbox" name="remember_me" class="w-4 h-4 rounded border-gray-300 text-green-600 focus:ring-green-500">
                        <span>记住我</span>
                    </label>
                    <a href="#" class="text-sm text-green-600 hover:text-green-700">忘记密码？</a>
                </div>

                <!-- 登录按钮 -->
                <button type="submit" class="btn-primary w-full py-3 text-center text-base">
                    🔓 登录
                </button>

                <!-- 注册链接 -->
                <p class="text-center text-sm text-gray-400 mt-4">
                    还没有账号？ <a href="{% url 'users:register' %}" class="text-green-600 hover:text-green-700 font-medium">立即注册 →</a>
                </p>

                <!-- 分隔线 -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-gray-400">或者</span>
                    </div>
                </div>

                <!-- 邮箱验证码登录（后期功能） -->
                <button type="button" disabled class="w-full py-2.5 border-2 border-gray-200 rounded-full text-sm text-gray-400 hover:border-gray-300 transition cursor-not-allowed">
                    📧 用邮箱验证码登录（即将上线）
                </button>
            </form>
        </div>

        <!-- 底部小青蛙装饰 -->
        <div class="text-center mt-6 text-2xl opacity-20 select-none">
            🐸 🐸 🐸
        </div>
    </div>
</div>
{% endblock %}
