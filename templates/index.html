{% extends 'base.html' %}
{% load static %}

{% block title %}首页 - 加油哇 🐸{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    
    <!-- 视图切换 -->
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-2 text-sm text-gray-400">
            <span>📚 发现好资源</span>
        </div>
        <div class="flex items-center space-x-1 bg-gray-100 rounded-lg p-1">
            <a href="?mode=list" 
               class="view-mode-btn px-3 py-1.5 rounded-lg text-sm font-medium transition-all {% if view_mode == 'list' %}bg-white shadow text-gray-800{% else %}text-gray-500 hover:text-gray-700{% endif %}"
               data-mode="list">
                📋 列表
            </a>
            <a href="?mode=card" 
               class="view-mode-btn px-3 py-1.5 rounded-lg text-sm font-medium transition-all {% if view_mode == 'card' %}bg-white shadow text-gray-800{% else %}text-gray-500 hover:text-gray-700{% endif %}"
               data-mode="card">
                🎴 卡片
            </a>
        </div>
    </div>
    
    <!-- 资源列表 -->
    <div id="resource-list">
        {% include 'partials/resource_list.html' %}
    </div>
    
</div>
{% endblock %}

{% block extra_js %}
<script>
    let page = 1;
    let loading = false;
    let hasMore = true;
    let observer = null;

    function getCurrentMode() {
        const activeBtn = document.querySelector('.view-mode-btn.bg-white');
        return activeBtn ? activeBtn.dataset.mode : 'list';
    }

    function loadMore() {
        if (loading || !hasMore) {
            return;
        }
        loading = true;
        page += 1;

        const mode = getCurrentMode();

        fetch(`/?page=${page}&mode=${mode}`, {
            headers: { 'HX-Request': 'true' }
        })
        .then(response => response.text())
        .then(html => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const newContent = doc.querySelector('#resource-list');

            if (newContent) {
                const list = document.getElementById('resource-list');
                const hasNextSentinel = newContent.querySelector('#scroll-sentinel');
                if (!hasNextSentinel) {
                    hasMore = false;
                }
                const oldSentinel = document.getElementById('scroll-sentinel');
                if (oldSentinel) oldSentinel.remove();
                const newSentinel = newContent.querySelector('#scroll-sentinel');
                if (newSentinel) newSentinel.remove();
                list.insertAdjacentHTML('beforeend', newContent.innerHTML);
                
                // 检查是否已经存在"已经到底了"
                const existingEnd = list.querySelector('.text-center.text-gray-400.text-sm.py-4');
                
                if (hasNextSentinel) {
                    // 如果已经存在"已经到底了"，移除它
                    if (existingEnd) existingEnd.remove();
                    const sentinel = document.createElement('div');
                    sentinel.id = 'scroll-sentinel';
                    sentinel.className = 'h-4';
                    list.appendChild(sentinel);
                    if (observer) {
                        observer.disconnect();
                    }
                    observer = new IntersectionObserver(function(entries) {
                        if (entries[0].isIntersecting && !loading && hasMore) {
                            loadMore();
                        }
                    }, { rootMargin: '200px' });
                    observer.observe(sentinel);
                } else {
                    // 没有更多数据，如果"已经到底了"不存在则添加
                    if (!existingEnd) {
                        const endMsg = document.createElement('div');
                        endMsg.className = 'text-center text-gray-400 text-sm py-4';
                        endMsg.textContent = '— 已经到底了 🐸 —';
                        list.appendChild(endMsg);
                    }
                }
            } else {
                hasMore = false;
                const list = document.getElementById('resource-list');
                const existingEnd = list.querySelector('.text-center.text-gray-400.text-sm.py-4');
                if (!existingEnd) {
                    const endMsg = document.createElement('div');
                    endMsg.className = 'text-center text-gray-400 text-sm py-4';
                    endMsg.textContent = '— 已经到底了 🐸 —';
                    list.appendChild(endMsg);
                }
            }
            loading = false;
        })
        .catch(() => {
            loading = false;
            hasMore = false;
        });
    }

    function setupObserver() {
        const sentinel = document.getElementById('scroll-sentinel');
        if (!sentinel) return;
        if (observer) {
            observer.disconnect();
        }
        observer = new IntersectionObserver(function(entries) {
            if (entries[0].isIntersecting && !loading && hasMore) {
                loadMore();
            }
        }, { rootMargin: '200px' });
        observer.observe(sentinel);
    }

    document.addEventListener('DOMContentLoaded', function() {
        page = 1;
        hasMore = true;
        loading = false;
        setupObserver();
    });
</script>
{% endblock %}
